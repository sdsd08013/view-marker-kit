name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release build
        run: ./gradlew :viewmarkerkit:testDebugUnitTest :viewmarkerkit:assembleRelease --no-daemon

      - name: Build sample
        run: ./gradlew :sample-views:assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: viewmarkerkit/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
